    <script>
        // Adjust parallax effect for touch devices
        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY;
            const solarSyst = document.querySelector('.solar-syst');
            if (solarSyst) {
                const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                const parallaxSpeed = isTouchDevice ? 0.02 : 0.1; // Reduce speed for touch devices
                solarSyst.style.transform = `translateY(${scrollPosition * -parallaxSpeed}px)`;
            }
        });
    </script>
